<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Drag & Drop Planner · Checklist + Calendar</title>
  <!-- CSS is linked here -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>
      📋 Drag & Drop Planner
      <span>7am – 7pm</span>
    </h1>

    <div class="dashboard">
      <!-- CHECKLIST PANEL (drop target + source) -->
      <div class="checklist-panel">
        <h2>✅ Checklist</h2>
        <div class="checklist-items" id="checklistItems">
          <!-- Tasks will be injected by JS -->
        </div>
      </div>

      <!-- CALENDAR PANEL (drop targets) -->
      <div class="calendar-panel">
        <div class="calendar-header">
          <h2>📅 Calendar</h2>
          <span style="font-size:0.8rem; color:#64748b;">drag tasks here</span>
        </div>
        <div class="calendar-grid" id="calendarGrid">
          <!-- time slots generated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript is linked here -->
  <script src="script.js"></script>
</body>
</html>
